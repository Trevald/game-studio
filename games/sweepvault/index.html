</main>
<script>

  { w: 7, h: 8,  mines: 7,  keys: 1, gems: 1, lamps: 0, hearts: 0, seed: 202, tip: "Gems are optional. Glints on numbers point at hidden items." },
  { w: 7, h: 9,  mines: 9,  keys: 1, gems: 2, lamps: 1, hearts: 0, seed: 303, tip: "Lantern: arm it, and your next dig opens a safe 3×3." },
  { w: 8, h: 10, mines: 12, keys: 1, gems: 2, lamps: 0, hearts: 1, seed: 404, tip: "A heart gives you one more mistake." },
  { w: 8, h: 10, mines: 13, keys: 2, gems: 0, lamps: 0, hearts: 0, seed: 505, minDigs: 8, tip: "Two keys this time." },
  { w: 8, h: 11, mines: 17, keys: 1, gems: 3, lamps: 1, hearts: 1, seed: 606, minDigs: 8, tip: "You don't have to clear the board. Leave when you can." },
  { w: 8, h: 12, mines: 19, keys: 2, gems: 3, lamps: 1, hearts: 0, seed: 707, minDigs: 10, tip: "Two keys, one lantern." },
  { w: 8, h: 12, mines: 21, keys: 3, gems: 3, lamps: 1, hearts: 1, seed: 808, minDigs: 12, tip: "The vault. Three keys." },

// =====================================================================

function newGame(levelIdx, layout) {

function clone(g) {

}
// reveal i (safe) and flood zeros; collects items. Returns list of newly revealed indices.
function revealFlood(g, i0) {

function isHidden(g, i) { return !g.rev[i] && !g.boom[i] && !g.marked[i]; }

  for (let i = 0; i < L.w * L.h; i++) {
    if (isHidden(g, i)) {
      if (!g.flag[i]) out.push({ t: "dig", x: i % L.w, y: (i / L.w) | 0 });

// Apply an action. Returns a NEW game object (old one kept for undo by caller).

// Returns {safe:Set, mines:Set}. Does not use hidden layout information.
