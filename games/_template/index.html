<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slide Eight</title>
<!--
  GAME STUDIO TEMPLATE — the reference implementation of the build contract.
  Copy this file to games/<slug>/index.html and replace the game, keeping:
    * one self-contained HTML file (libraries only from cdnjs/jsdelivr/unpkg, pinned versions)
    * a game core that is pure data + functions, separate from rendering
    * keyboard AND touch/mouse input, works at 390px wide, no alert/confirm/prompt
    * window.__qa = { state, actions, act, reset, levels, solve? }  (see bottom of script)
-->
<style>
  :root {
    --bg: #f3f1fb; --panel: #ffffff; --ink: #1d1b33; --muted: #6b6890; --tile: #4b47c4; --tile-ink: #ffffff; --goal: #2a8a5c;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #13122a; --panel: #1d1c3d; --ink: #ecebfa; --muted: #a3a0cc; --tile: #8f8bff; --tile-ink: #13122a; --goal: #6fd3a0; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #13122a; --panel: #1d1c3d; --ink: #ecebfa; --muted: #a3a0cc; --tile: #8f8bff; --tile-ink: #13122a; --goal: #6fd3a0; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font); display: grid; place-items: center;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
  main { width: min(100%, 420px); display: grid; gap: 14px; text-align: center; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.01em; }
  .hud { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
  #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--panel); padding: 8px; border-radius: 14px; aspect-ratio: 1; max-width: 100%; touch-action: manipulation; }
  .t { border: 0; border-radius: 10px; background: var(--tile); color: var(--tile-ink); font: 700 clamp(22px, 8vw, 34px)/1 var(--font); cursor: pointer; }
  .t.empty { background: transparent; cursor: default; }
  .t:focus-visible { outline: 3px solid var(--goal); outline-offset: 2px; }
  #msg { min-height: 1.4em; color: var(--goal); font-weight: 600; }
  button.next { justify-self: center; font: 600 15px var(--font); padding: 10px 18px; border-radius: 999px; border: 0; background: var(--goal); color: var(--bg); cursor: pointer; }
  .help { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Slide Eight</h1>
  <div class="hud"><span id="lvl">Level 1</span><span id="moves">0 moves</span></div>
  <div id="board" role="grid" aria-label="Puzzle board"></div>
  <div id="msg" aria-live="polite"></div>
  <button class="next" id="nextBtn" hidden>Next level</button>
  <p class="help">Tap a tile next to the gap, or use the arrow keys.</p>
</main>
<script>
// ---------- game core: pure data, no DOM ----------
const LEVELS = [
  [1,2,3,4,5,6,7,0,8],
  [1,2,3,4,0,6,7,5,8],
  [1,3,0,4,2,5,7,8,6],
  [4,1,3,7,2,6,0,5,8],
  [2,3,6,1,5,0,4,7,8],
];
const GOAL = "1,2,3,4,5,6,7,8,0";
const DIRS = { up: -3, down: 3, left: -1, right: 1 };

function newGame(level) {
  return { level, board: LEVELS[level].slice(), moves: 0, screen: "playing" };
}
// a move names the direction the GAP moves
function legalMoves(g) {
  if (g.screen !== "playing") return [];
  const z = g.board.indexOf(0), r = Math.floor(z / 3), c = z % 3, out = [];
  if (r > 0) out.push("up"); if (r < 2) out.push("down"); if (c > 0) out.push("left"); if (c < 2) out.push("right");
  return out;
}
function applyMove(g, dir) {
  if (!legalMoves(g).includes(dir)) return g;
  const b = g.board.slice(), z = b.indexOf(0), t = z + DIRS[dir];
  [b[z], b[t]] = [b[t], b[z]];
  const won = b.join() === GOAL;
  return { ...g, board: b, moves: g.moves + 1, screen: won ? "won" : "playing" };
}
function solveBoard(start) { // BFS, fine for 3x3
  const key = (b) => b.join();
  const prev = new Map([[key(start), null]]);
  const q = [start];
  while (q.length) {
    const b = q.shift();
    if (key(b) === GOAL) {
      const path = []; let k = key(b);
      while (prev.get(k)) { const [pk, mv] = prev.get(k); path.unshift(mv); k = pk; }
      return path;
    }
    const g = { board: b, screen: "playing" };
    for (const mv of legalMoves(g)) {
      const nb = applyMove({ ...g, moves: 0, level: 0 }, mv).board, nk = key(nb);
      if (!prev.has(nk)) { prev.set(nk, [key(b), mv]); q.push(nb); }
    }
  }
  return null;
}

// ---------- rendering + input ----------
let game = newGame(0);
const $ = (id) => document.getElementById(id);
function render() {
  const board = $("board");
  board.replaceChildren(...game.board.map((v, i) => {
    const t = document.createElement("button");
    t.className = "t" + (v ? "" : " empty");
    t.textContent = v || "";
    t.setAttribute("aria-label", v ? "Tile " + v : "Gap");
    t.tabIndex = v ? 0 : -1;
    t.onclick = () => tapTile(i);
    return t;
  }));
  $("lvl").textContent = `Level ${game.level + 1} of ${LEVELS.length}`;
  $("moves").textContent = `${game.moves} ${game.moves === 1 ? "move" : "moves"}`;
  const won = game.screen === "won";
  $("msg").textContent = won ? (game.level === LEVELS.length - 1 ? "All levels solved!" : `Solved in ${game.moves} moves`) : "";
  $("nextBtn").hidden = !won || game.level === LEVELS.length - 1;
}
function move(dir) { game = applyMove(game, dir); render(); }
function tapTile(i) {
  const z = game.board.indexOf(0);
  for (const [dir, d] of Object.entries(DIRS)) if (z + d === i && legalMoves(game).includes(dir)) return move(dir);
}
document.addEventListener("keydown", (e) => {
  // arrow pushes a tile INTO the gap, so the gap moves the opposite way
  const map = { ArrowUp: "down", ArrowDown: "up", ArrowLeft: "right", ArrowRight: "left" };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});
$("nextBtn").onclick = () => { game = newGame(Math.min(game.level + 1, LEVELS.length - 1)); render(); };
render();

// ---------- QA hook (required by the studio contract) ----------
window.__qa = {
  state: () => ({ screen: game.screen, level: game.level, moves: game.moves, board: game.board.slice() }),
  actions: () => legalMoves(game),
  act: (a) => move(a),
  reset: (level) => { game = newGame(level ?? game.level); render(); },
  levels: () => LEVELS.length,
  solve: () => solveBoard(game.board),
};
</script>
</body>
</html>
