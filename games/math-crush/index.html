<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Math Crush</title>
<!--
  Math Crush — three prototypes of "Candy Crush but math based" (Match / Equation / Clear).
  Rules, scoring and layout: design/handover-v1/docs/Studio-Handoff.md (designer). Art: assets/ (designer).
  The page is a fixed 390x844 logical stage (the spec's coordinate system) scaled to fit the window.
  Sections: data, core (pure), persistence, sound, rendering, input, QA hook.
-->
<style>
  :root { color-scheme: dark; --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Arial Rounded MT Bold", Arial, sans-serif; --gold: #ffd54a; --gold2: #f4a81d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120d24; color: #fff; font-family: var(--font); }
  #bg { position: fixed; inset: 0; background: #120d24 center / cover no-repeat; transition: background-image .2s; }
  #bg.hub { background-image: radial-gradient(120% 80% at 50% 0%, #3a2266 0%, #191233 55%, #0c0a1c 100%); }
  #bg::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.08); transition: background .15s; }
  #bg.dim::after { background: rgba(8,6,20,.62); }
  .mhead:focus { outline: none; }
  #app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  #stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; user-select: none; -webkit-user-select: none; }
  .abs { position: absolute; }
  svg.abs, .shade, .toast { pointer-events: none; }
  button { font-family: var(--font); cursor: pointer; border: 0; padding: 0; background: none; color: inherit; touch-action: manipulation; }
  button:focus-visible, .kcur { outline: 3px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 7px rgba(0,0,0,.45); }
  button:disabled { cursor: default; }
  .sprite { background-repeat: no-repeat; }
  .shadowtext { text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 8px rgba(0,0,0,.35); }
  .center { display: flex; align-items: center; justify-content: center; text-align: center; }
  .press { transition: transform 90ms ease-out, filter .15s; }
  .press:active:not(:disabled) { transform: scale(.96); transition-duration: 70ms; }
  .btn { font-weight: 900; font-size: 20px; line-height: 24px; }
  .btn:disabled { filter: saturate(.25) brightness(.8); opacity: .6; }
  .lbl { font-size: 13px; font-weight: 800; }

  /* hub */
  .hubtitle { left: 0; width: 390px; top: 70px; font-size: 44px; font-weight: 900; text-align: center; letter-spacing: -.5px; }
  .hubsub { left: 30px; width: 330px; top: 128px; font-size: 16px; line-height: 22px; text-align: center; color: #d9d2f2; font-weight: 700; }
  .card { left: 24px; width: 342px; height: 176px; border-radius: 22px; overflow: hidden; text-align: left; background: #222 center / cover no-repeat;
    box-shadow: 0 8px 20px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,213,74,.85); }
  .card .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,8,25,.82) 0%, rgba(10,8,25,.55) 60%, rgba(10,8,25,.15) 100%); }
  .card .t1 { position: absolute; left: 20px; top: 16px; font-size: 12px; letter-spacing: 1.5px; color: #ffe9a6; font-weight: 900; }
  .card .t2 { position: absolute; left: 20px; top: 34px; font-size: 27px; line-height: 30px; font-weight: 900; width: 230px; }
  .card .t3 { position: absolute; left: 20px; top: 100px; font-size: 15px; line-height: 19px; color: #eee; width: 220px; font-weight: 700; }
  .card .t4 { position: absolute; left: 20px; bottom: 12px; font-size: 13px; color: #ffe08a; font-weight: 800; }
  .card .go { position: absolute; right: 18px; top: 58px; width: 60px; height: 60px; border-radius: 50%; background: var(--gold); color: #3a2300; font-size: 30px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #b27400; }

  /* home */
  .world { left: 0; width: 390px; top: 120px; font-size: 14px; letter-spacing: 1.5px; font-weight: 900; text-align: center; }
  .title { left: 0; width: 390px; font-size: 40px; font-weight: 900; text-align: center; line-height: 44px; }
  .vignette { left: 27px; top: 272px; width: 336px; height: 336px; border-radius: 26px; background: rgba(20,10,30,.42); }
  .subtitle { left: 10px; width: 370px; top: 616px; font-size: 18px; text-align: center; font-weight: 800; }
  .footnote { left: 0; width: 390px; top: 760px; font-size: 14px; text-align: center; font-weight: 800; }

  /* tiles */
  .tile { position: absolute; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .tile .badge { position: absolute; right: -6px; top: -8px; width: 22px; height: 22px; border-radius: 50%; background: #fff5c8; color: #5a3b00; font-size: 13px; line-height: 22px;
    text-align: center; border: 2px solid var(--gold2); font-weight: 900; text-shadow: none; }
  .tile.sel::after { content: ""; position: absolute; inset: -4px; border: 4px solid var(--gold); border-radius: 16px; box-shadow: 0 0 12px 3px rgba(255,213,74,.75); pointer-events: none; }
  .tile.hint::after { content: ""; position: absolute; inset: -4px; border: 4px dashed #7ff3ff; border-radius: 16px; animation: hintpulse 1s ease-in-out infinite alternate; pointer-events: none; }
  .tile.used { filter: saturate(.45) brightness(.82); }
  .tile.hole { background: rgba(10,30,70,.45) !important; box-shadow: inset 0 4px 10px rgba(0,0,0,.5); border-radius: 14px; }
  .digit-candy { color: #fff; text-shadow: -2px -2px 0 #3a1a10, 2px -2px 0 #3a1a10, -2px 2px 0 #3a1a10, 2px 2px 0 #3a1a10, 0 3px 0 #3a1a10; }
  .digit-stone { color: #17407a; }
  .digit-ice { color: #164D92; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .drop { animation: drop 180ms ease-in both; }
  @keyframes drop { from { transform: translateY(var(--dy)); } to { transform: none; } }
  @keyframes hintpulse { from { opacity: .45; } to { opacity: 1; } }
  .ghost { position: absolute; pointer-events: none; animation: pop 180ms ease-out forwards; }
  @keyframes pop { 0% { transform: scale(1); opacity: 1; } 60% { transform: scale(1.18); opacity: .9; } 100% { transform: scale(.2); opacity: 0; } }
  .shard { position: absolute; width: 10px; height: 16px; background: linear-gradient(#e6fbff, #6fd6ff); clip-path: polygon(50% 0, 100% 60%, 40% 100%, 0 45%);
    pointer-events: none; animation: shard 420ms ease-out forwards; }
  @keyframes shard { to { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)); opacity: 0; } }
  .confetti { position: absolute; top: -20px; width: 9px; height: 14px; pointer-events: none; animation: fall 1.2s ease-in forwards; z-index: 60; }
  @keyframes fall { to { transform: translate(var(--cx), 900px) rotate(var(--cr)); opacity: .2; } }
  .flash { animation: flash 350ms ease-out; }
  @keyframes flash { 0% { filter: brightness(1.8); } 100% { filter: none; } }
  .shake { animation: nudge 260ms ease-in-out; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* HUD */
  .well { left: 26px; top: 266px; width: 338px; height: 342px; border-radius: 24px; background: rgba(25,12,22,.48); box-shadow: inset 0 3px 14px rgba(0,0,0,.45); }
  .plaquetext { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; text-align: center; }
  .levelno { left: 95px; width: 200px; top: 64px; font-size: 20px; font-weight: 900; letter-spacing: 1px; text-align: center; }
  .pausebtn { left: 19px; top: 51px; width: 48px; height: 48px; border-radius: 14px; border: 3px solid var(--gold); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .pausebtn i { position: absolute; top: 12px; width: 6px; height: 18px; background: #fff; border-radius: 2px; }
  .medal { width: 58px; height: 58px; border-radius: 50%; }
  .medal:disabled { filter: saturate(.2) brightness(.75); opacity: .6; }
  .medallbl { font-size: 14px; font-weight: 900; text-align: center; width: 80px; }
  .toast { left: 45px; width: 300px; top: 222px; height: 34px; border-radius: 17px; background: rgba(0,0,0,.72); font-size: 15px; font-weight: 800; z-index: 40; pointer-events: none;
    transition: opacity .2s; }
  .coach { left: 16px; width: 358px; border-radius: 16px; background: rgba(10,10,30,.86); border: 2px solid var(--gold); padding: 8px 12px; font-size: 15px; line-height: 20px; font-weight: 800; text-align: center; z-index: 30; }

  /* modals */
  .scrim { position: absolute; inset: 0; background: rgba(8,6,20,.62); z-index: 50; animation: fade 150ms ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .modal { left: 31px; top: 249px; width: 328px; height: 408px; }
  .mhead { left: 31px; width: 328px; font-size: 28px; font-weight: 900; text-align: center; }
  .mtext { left: 60px; width: 270px; font-size: 16px; line-height: 22px; text-align: center; font-weight: 800; }
  .mbtn { left: 65px; width: 260px; height: 54px; }
  .toggle { height: 44px; width: 128px; border-radius: 22px; font-size: 15px; font-weight: 900; border: 2px solid rgba(0,0,0,.25); }

  /* level select */
  .node { width: 58px; height: 58px; border-radius: 18px; border: 3px solid var(--gold); font-size: 24px; font-weight: 900; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .node.locked { filter: grayscale(.85) brightness(.7); border-color: #bbb; }
  .node.next { animation: nextpulse 1.1s ease-in-out infinite alternate; }
  @keyframes nextpulse { from { box-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 0 0 rgba(255,213,74,.9); } to { box-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 0 9px rgba(255,213,74,.0); } }
  .nodelbl { width: 100px; font-size: 13px; font-weight: 900; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .drop, .confetti, .shard { animation: none !important; display: none; }
    .drop { display: flex; }
    .ghost { animation: fadeout 80ms linear forwards; }
    .node.next, .tile.hint::after { animation: none; }
    .press:active:not(:disabled) { transform: none; }
  }
  @keyframes fadeout { to { opacity: 0; } }

  /* ================= Candy Match (H-001-v1) — flowing phone-width layout ================= */
  #flow { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; color: #4A1736;
    --cream: #FFF3DD; --edge: #E9BE8B; --plum: #4A1736; --rasp: #C81758; --rasp2: #A10F45; --gold: #FFE09A; --amber: #E8890C;
    --well: rgba(74,23,54,.75); --muted: #7A4B63; font-size: 1rem; }
  #flow[hidden] { display: none; }
  .mc { position: relative; max-width: 480px; margin: 0 auto; min-height: 100%; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 12px; }
  .mc button { font-family: var(--font); color: inherit; cursor: pointer; }
  .mc button:focus-visible, .mcm button:focus-visible, .mc .kfocus { outline: none; box-shadow: 0 0 0 3px var(--cream), 0 0 0 6px var(--plum) !important; }
  .panel { background: var(--cream); border: 1px solid var(--edge); border-radius: 24px; box-shadow: 0 6px 14px rgba(74,23,54,.22); }
  .pbtn { min-height: 56px; border-radius: 18px; border: 1px solid #8F1647; background: var(--rasp); color: #fff !important; font-weight: 900; font-size: 1.25rem;
    box-shadow: 0 4px 0 #8F1647, 0 6px 12px rgba(74,23,54,.25); padding: 8px 18px; width: 100%; transition: transform 70ms, box-shadow 70ms, background 70ms; }
  .sbtn { min-height: 48px; border-radius: 18px; border: 1px solid var(--plum); background: var(--cream); color: var(--plum) !important; font-weight: 900; font-size: 1.125rem;
    box-shadow: 0 3px 0 rgba(74,23,54,.35); padding: 6px 16px; width: 100%; transition: transform 70ms, box-shadow 70ms, background 70ms; }
  .tbtn { min-height: 44px; border: 0; background: none; color: var(--plum) !important; font-weight: 800; font-size: 1rem; text-decoration: underline; text-underline-offset: 3px; padding: 6px 12px; }
  .ibtn { width: 44px; height: 44px; min-width: 44px; border-radius: 14px; border: 1px solid var(--edge); background: var(--cream); color: var(--plum) !important;
    display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(74,23,54,.3); padding: 0; }
  .ibtn svg { width: 22px; height: 22px; }
  .pbtn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #8F1647; background: var(--rasp2); }
  .sbtn:active:not(:disabled), .ibtn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(74,23,54,.35); background: #F4E2C4; }
  .pbtn:disabled, .sbtn:disabled { background: #E7D7C6; color: #8E7584 !important; border-color: #C9B3A3; box-shadow: none; cursor: default; }
  .row { display: flex; gap: 12px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .center-text { text-align: center; }
  .eyebrow { font-size: 0.875rem; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .h1 { font-size: 1.875rem; line-height: 1.1; font-weight: 900; margin: 0; }
  .lede { font-size: 1.0625rem; line-height: 1.35; font-weight: 700; margin: 0; }
  .small { font-size: 0.875rem; line-height: 1.35; font-weight: 700; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .stars { display: inline-flex; gap: 2px; vertical-align: middle; }
  .stars svg { width: 1.05em; height: 1.05em; }

  /* home */
  .mc-top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
  .quiet { min-height: 44px; border: 0; background: rgba(255,243,221,.86); color: var(--plum) !important; border-radius: 22px; padding: 0 14px; font-weight: 800; font-size: 0.9375rem; }
  .logo { text-align: center; margin-top: 8px; }
  .logo .t { font-size: 2.875rem; line-height: 1; font-weight: 900; color: #fff; letter-spacing: -.5px;
    text-shadow: 0 3px 0 var(--rasp), 0 6px 0 var(--plum), 0 10px 18px rgba(74,23,54,.45); }
  .logo .m { display: inline-block; margin-top: 14px; padding: 6px 14px; border-radius: 16px; background: var(--cream); border: 1px solid var(--edge); font-weight: 900; font-size: 1rem; letter-spacing: .5px; }
  .vign { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .vign .tiles { display: grid; grid-template-columns: repeat(3, 72px); gap: 8px; padding: 8px; border-radius: 18px; background: var(--well); }
  .vign .tiles .tile2 { width: 72px; height: 72px; font-size: 2rem; }

  /* level trail */
  .trail { position: relative; width: 100%; height: 540px; }
  .trail svg.path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .node2 { position: absolute; width: 58px; height: 58px; margin-left: -29px; margin-top: -29px; border-radius: 50%; font-size: 1.5rem; font-weight: 900;
    background: var(--cream); border: 2px solid var(--plum); color: var(--plum) !important; box-shadow: 0 4px 0 rgba(74,23,54,.35); }
  .node2.next { background: var(--rasp); border-color: #8F1647; color: #fff !important; box-shadow: 0 4px 0 #8F1647, 0 0 0 6px rgba(255,224,154,.8); }
  .node2.locked { background: #E7D7C6; border-color: #B79C8D; color: #8E7584 !important; }
  .node2 .lock { position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--plum); display: flex; align-items: center; justify-content: center; }
  .nodecap { position: absolute; width: 96px; margin-left: -48px; margin-top: 34px; text-align: center; font-size: 0.8125rem; font-weight: 900; color: var(--plum);
    background: rgba(255,243,221,.92); border-radius: 10px; padding: 2px 4px; pointer-events: none; }

  /* intro */
  .mcard { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fact { background: #fff; border: 1px solid var(--edge); border-radius: 16px; padding: 8px 6px; text-align: center; }
  .fact b { display: block; font-size: 1.625rem; line-height: 1.1; }
  .fact span { font-size: 0.875rem; font-weight: 800; color: var(--muted); }
  .thresh { display: flex; flex-direction: column; gap: 6px; background: #fff; border: 1px solid var(--edge); border-radius: 16px; padding: 10px 12px; }
  .thresh .row { justify-content: space-between; font-weight: 800; }
  .coachcard { border: 2px dashed var(--rasp); background: #FFF9EE; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .demo { display: flex; gap: 6px; justify-content: center; padding: 6px; border-radius: 14px; background: var(--well); align-self: center; }
  .demo .tile2 { width: 48px; height: 48px; font-size: 1.375rem; }

  /* gameplay */
  .playtop { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; min-height: 44px; gap: 8px; }
  .lvl { text-align: center; font-weight: 900; font-size: 1.125rem; background: rgba(255,243,221,.9); border-radius: 14px; padding: 4px 10px; justify-self: center; display: flex; gap: 10px; align-items: center; }
  .clock { font-variant-numeric: tabular-nums; font-size: 0.9375rem; padding: 2px 8px; border-radius: 10px; background: #fff; border: 1px solid var(--edge); }
  .hud { display: grid; grid-template-columns: minmax(88px, auto) 1fr minmax(88px, auto); gap: 12px; }
  .hcard { min-height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4px; border-radius: 18px; }
  .hcard span { font-size: 0.875rem; font-weight: 900; color: var(--muted); }
  .hcard b { font-size: 1.625rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .hcard.tgt b { font-size: 2.25rem; }
  .quota { min-height: 32px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 2px 12px; border-radius: 16px; font-weight: 900; font-size: 0.9375rem; }
  .qdot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--plum); background: #fff; }
  .qdot.on { background: var(--rasp); border-color: #8F1647; }
  .boardwrap { position: relative; width: min(100%, 350px); align-self: center; }
  #mboard { position: relative; width: 100%; aspect-ratio: 1; padding: 4px; border-radius: 22px; background: var(--well); display: grid; grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr); gap: 8px; touch-action: none; container-type: inline-size; box-shadow: inset 0 3px 12px rgba(0,0,0,.35); }
  .tile2 { position: relative; display: flex; align-items: center; justify-content: center; border-radius: 16px; font-weight: 900; color: #fff; font-size: 9.6cqw;
    text-shadow: -2px -2px 0 #3a1a10, 2px -2px 0 #3a1a10, -2px 2px 0 #3a1a10, 2px 2px 0 #3a1a10, 0 3px 0 #3a1a10; background-repeat: no-repeat; user-select: none; -webkit-user-select: none; }
  .tile2 .d { position: relative; z-index: 3; line-height: 1; }
  .tile2.noart { box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.4); border: 2px solid rgba(255,255,255,.6); }
  .tile2 .sp-stripe { position: absolute; inset: 14% 10%; border-radius: 8px; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.8) 0 3px, rgba(255,255,255,0) 3px 8px); box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
  .tile2 .sp-wrap { position: absolute; inset: 3px; border-radius: 13px; z-index: 2; pointer-events: none; border: 3px dashed rgba(255,255,255,.95);
    background: linear-gradient(135deg, #fff 0 9px, transparent 9px), linear-gradient(225deg, #fff 0 9px, transparent 9px), linear-gradient(45deg, #fff 0 9px, transparent 9px), linear-gradient(315deg, #fff 0 9px, transparent 9px); }
  .tile2 .badge2 { position: absolute; right: -5px; top: -7px; z-index: 6; min-width: 22px; height: 22px; padding: 0 3px; border-radius: 11px; background: var(--gold); color: var(--plum);
    border: 2px solid var(--plum); font-size: 0.8125rem; line-height: 18px; text-align: center; text-shadow: none; font-weight: 900; }
  .tile2.sel::after { content: ""; position: absolute; inset: -3px; border-radius: 18px; border: 4px solid var(--gold); box-shadow: 0 0 10px 2px rgba(255,224,154,.85); z-index: 4; pointer-events: none; }
  .tile2.over::after { border-color: var(--amber); box-shadow: 0 0 0 2px var(--plum); }
  .tile2.blast::before { content: ""; position: absolute; inset: -2px; border-radius: 18px; z-index: 4; pointer-events: none; border: 3px dotted #fff;
    background: repeating-linear-gradient(45deg, rgba(255,224,154,.5) 0 6px, rgba(255,224,154,.1) 6px 12px); }
  .tile2.hint::after { content: ""; position: absolute; inset: -3px; border-radius: 18px; border: 4px dashed #fff; z-index: 4; pointer-events: none; animation: hintpulse 1s ease-in-out infinite alternate; }
  .tile2.kcur { box-shadow: 0 0 0 3px var(--cream), 0 0 0 6px var(--plum); z-index: 5; }
  .tile2.drop2 { animation: drop2 180ms ease-in both; }
  @keyframes drop2 { from { transform: translateY(calc(var(--dr) * (-100% - 8px))); } to { transform: none; } }
  .tile2.fresh-reward { animation: rewardin 320ms ease-out; }
  @keyframes rewardin { 0% { transform: scale(.6); } 70% { transform: scale(1.12); } 100% { transform: none; } }
  #mboard svg.trace { position: absolute; inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px); z-index: 5; pointer-events: none; overflow: visible; }
  .ghosts { position: absolute; inset: 4px; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 8px; pointer-events: none; z-index: 7; }

  else if (a === "undo") r = C.undo(before);
  else if (a === "hint") r = C.hint(before);
  else if (a[0] === "t") r = C.tap(before, +a.slice(1));
  if (!r || r.g === before) return;
  ui.game = r.g;
  if (r.ev && r.ev.type === "clear") { ui.showCoach = false; sfx.good(); buzz(15); tileFx(before, r.ev.ids.map((i) => ({ i, v: before.values[i] })), "shards"); announce(`${C.remaining(r.g).length} tiles left.`); }
  else if (r.ev && r.ev.type === "undo") { sfx.tap(); announce(`Undone. ${C.remaining(r.g).length} tiles left.`); }
  else if (a[0] === "t") sfx.pick(r.g.sel.length);
  onResult(r.g);
  render();
}

function requestRestart() { if (CORE[ui.mode].hasProgress(ui.game) && ui.game.status === "playing") { ui.modal = "confirm-restart"; render(); } else { startLevel(ui.mode, ui.game.li); render(); } }

function onButton(k) {
  sfx.tap();
  if (k.startsWith("mode-")) { ui.mode = k.slice(5); ui.screen = "home"; if (ui.mode === "match") loadArt(); }
  else if (k === "hub") ui.screen = "hub";
  else if (k === "play") { ui.screen = "levels"; }
  else if (k === "home") ui.screen = "home";
  else if (k.startsWith("lvl-")) {
    const li = +k.slice(4);
    if (li + 1 > progress[ui.mode].unlocked) { toast(`Finish level ${li} to unlock`); return; }
    startLevel(ui.mode, li);
  }
  else if (k === "pause") ui.modal = "pause";
  else if (k === "resume" || k === "cancel" && ui.modal) ui.modal = k === "cancel" ? "pause" : null;
  else if (k === "restart") { if (CORE[ui.mode].hasProgress(ui.game)) ui.modal = "confirm-restart"; else { startLevel(ui.mode, ui.game.li); } }
  else if (k === "levels") { if (CORE[ui.mode].hasProgress(ui.game)) ui.modal = "confirm-levels"; else { ui.modal = null; ui.screen = "levels"; } }
  else if (k === "confirm") { if (ui.modal === "confirm-restart") startLevel(ui.mode, ui.game.li); else { ui.modal = null; ui.screen = "levels"; } }
  else if (k === "snd") { progress.settings.sound = !progress.settings.sound; save(); }
  else if (k === "hap") { progress.settings.haptics = !progress.settings.haptics; save(); if (progress.settings.haptics) buzz(20); }
  else if (k === "help") ui.modal = "help";
  else if (k === "closehelp") ui.modal = null;
  else if (k === "next") startLevel(ui.mode, ui.game.li + 1);
  else if (k === "retry" || k === "restart2") startLevel(ui.mode, ui.game.li);
  else if (k === "levels2") { ui.modal = null; ui.screen = "levels"; }
  else if (k === "undo2" || k === "undo") { clearAct("undo"); return; }
  else if (k === "hint") { if (ui.mode === "match") mHint(); else if (ui.mode === "equation") eqInput("hint"); else clearAct("hint"); return; }
  else if (k === "submit") { eqInput("submit"); return; }
  else if (k === "back") { eqInput("back"); return; }
  else if (k === "clr") { eqInput("clear"); return; }
  else if (/^n\d$/.test(k)) { eqInput(k); return; }
  else if (/^op\d$/.test(k)) { eqInput(OPS[+k.slice(2)]); return; }
  else if (k === "clearbtn") { clearAct("clear"); return; }
  else if (/^t\d+$/.test(k)) { clearAct(k); return; }
  render();
}

// ======================================================================
// INPUT — pointer (one owner), keyboard
// ======================================================================
stage.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b || b.disabled) return;
  if (ui.screen === "play" && Date.now() < ui.busyUntil && !ui.modal) return;
  ui.kbd = e.detail === 0 && ui.kbd; // keyboard "click" keeps the cursor visible
  onButton(b.dataset.k);
});

document.addEventListener("visibilitychange", () => { // OS interruption: cancel gesture, pause
  if (document.hidden && ui.mode === "match" && ui.screen === "play" && ui.game && ui.game.status === "playing") { mOpenModal(ui.modal || "pause", "pause"); persistActive(); render(); return; }
  if (document.hidden && ui.screen === "play" && ui.game && ui.game.status === "playing") { ui.chain = []; if (ui.game.mode === "equation") { /* keep tokens; editing is reversible */ } ui.modal = ui.modal || "pause"; render(); }
});

document.addEventListener("keydown", (e) => {
  if (ui.mode === "match" && ui.screen !== "hub") { mKey(e); return; }
  const k = e.key;
  if (k === "Escape") {
    e.preventDefault();
    if (ui.screen === "play") { if (ui.modal === "pause" || ui.modal === "help") ui.modal = null; else if (ui.modal) ui.modal = "pause"; else if (ui.game.status === "playing") ui.modal = "pause"; else { ui.screen = "levels"; } }
    else if (ui.screen === "levels") ui.screen = "home"; else if (ui.screen === "home") ui.screen = "hub";
    render(); return;
  }
  if (ui.screen !== "play" || ui.modal || !ui.game || ui.game.status !== "playing") return;
  const g = ui.game;
  if (k === "h" || k === "H") { onButton("hint"); return; }
  if (k === "r" || k === "R") { requestRestart(); return; }
  if (g.mode === "equation") {
    if (/^[1-6]$/.test(k)) { eqInput("n" + (+k - 1)); e.preventDefault(); }
    else if (k === "+") eqInput("+"); else if (k === "-" || k === "−") eqInput("-");
    else if (k === "*" || k === "x" || k === "X") eqInput("*");
    else if (k === "Backspace") { e.preventDefault(); eqInput("back"); }
    else if (k === "Delete") eqInput("clear");
    else if (k === "Enter" && !(document.activeElement && document.activeElement.tagName === "BUTTON")) { e.preventDefault(); eqInput("submit"); }
    return;
  }
  const cols = g.cols, n = g.mode === "match" ? g.cells.length : g.values.length;
  const mv = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols }[k];
  if (mv !== undefined) {
    e.preventDefault();
    if (!ui.kbd) { ui.kbd = true; if (g.mode === "match" && ui.chain.length) ui.cursor = ui.chain[ui.chain.length - 1]; }
    else {
      const c = ui.cursor % cols;
      if ((k === "ArrowLeft" && c === 0) || (k === "ArrowRight" && c === cols - 1)) { /* edge */ }
      else ui.cursor = Math.max(0, Math.min(n - 1, ui.cursor + mv));
    }
    if (g.mode === "match") ui.prevPos = null;
    render(); return;
  }
  if (k === " " || k === "Spacebar") {
    e.preventDefault(); ui.kbd = true;
    if (g.mode === "match") {
      const ch = ui.chain, i = ui.cursor; ui.hintChain = null; ui.showCoach = false;
      if (ch.length && (i === ch[ch.length - 1] || i === ch[ch.length - 2])) { if (i === ch[ch.length - 1]) ch.pop(); else ch.pop(); }
      else if (!ch.length) ch.push(i);
      else if (ch.includes(i)) toast("Already in the chain");
      else if (ch.length >= 8) toast("Chains are at most 8 tiles");
      else if (!M.adjacent(g, ch[ch.length - 1], i)) toast("Pick a tile next to the last one");
      else ch.push(i);
      sfx.pick(ch.length); ui.prevPos = null; render();
    } else clearAct("t" + ui.cursor);
    return;
  }
  if (k === "Enter" && !(document.activeElement && document.activeElement.tagName === "BUTTON")) {
    e.preventDefault();
    clearAct("clear");
    return;
  }
  if ((k === "u" || k === "U" || (k === "z" && (e.ctrlKey || e.metaKey))) && g.mode === "clear") { e.preventDefault(); clearAct("undo"); }
});

render();

// ======================================================================
// QA HOOK — levels() = 36: 0–11 Match, 12–23 Equation, 24–35 Clear
// ======================================================================
function qaScreen() {
  if (ui.mode === "match" && ui.screen !== "play") return ui.screen; // hub | home | levels | intro
  if (ui.screen !== "play") return ui.screen;
  if (ui.modal) return "paused";
  return ui.game.status; // playing | won | lost | stuck
}
// MC-009: run the designer's mechanics fixtures through the real engine (M.resolve / M.release / M.extend)
const FIXTURES = {"schemaVersion":1,"indexing":"row-major 0..24","board":[2,3,1,4,7,4,1,6,2,8,5,3,2,9,1,7,2,4,3,6,1,5,2,4,8],"target":10,"cases":[{"id":"ordinary-four","level":4,"chain":[0,1,2,3],"specials":{},"sum":10,"chainPoints":300,"blastPoints":0,"removed":[0,1,2,3],"reward":{"cell":3,"value":4,"type":"stripe"}},{"id":"stripe","level":4,"chain":[0,1,2,3],"specials":{"2":"stripe"},"sum":10,"chainPoints":300,"blastPoints":25,"removed":[0,1,2,3,4],"reward":{"cell":3,"value":4,"type":"stripe"}},{"id":"wrapped-edge","level":7,"chain":[0,1,2,3],"specials":{"0":"wrapped"},"sum":10,"chainPoints":300,"blastPoints":50,"removed":[0,1,2,3,5,6]},{"id":"recursive","level":7,"chain":[0,1,2,3],"specials":{"0":"wrapped","5":"stripe"},"sum":10,"chainPoints":300,"blastPoints":125,"removed":[0,1,2,3,5,6,7,8,9]},{"id":"wrong-sum","level":4,"chain":[0,1,6,7],"specials":{"1":"stripe"},"sum":12,"chainPoints":0,"blastPoints":0,"removed":[]},{"id":"diagonal-invalid","chain":[0,6],"reject":"non-orthogonal selection; ignore second tile, no committed move"},{"id":"repeated-nontail","chain":[0,1,2,0],"reject":"ignore repeated non-tail entry"}]};
function runFixtures() {
  const out = [];
  for (const c of FIXTURES.cases) {
    const li = (c.level || 4) - 1, g = M.start(li);
    g.target = FIXTURES.target; g.cells = FIXTURES.board.map((v, i) => ({ id: i, v, sp: (c.specials || {})[i] || null }));
    if (c.reject) {
      let ch = []; for (const i of c.chain) ch = M.extend(g, ch, i);
      const r = M.release(g, c.chain);
      const ok = ch.length < c.chain.length && r.g === g && r.ev && r.ev.type === "cancel";
      out.push({ id: c.id, ok, got: { dragChain: ch, committed: r.g !== g } });
      continue;
    }
    const sum = M.sum(g, c.chain), r = M.release(g, c.chain);
    let got;
    if (sum !== g.target) got = { sum, chainPoints: 0, blastPoints: 0, removed: [], movesUsed: g.movesLeft - r.g.movesLeft, made: r.g.made };
    else { const R = M.resolve(g, c.chain); got = { sum, chainPoints: R.chainPts, blastPoints: R.blastPts, removed: R.removal, reward: R.reward, committedPts: r.g.chainPts + r.g.blastPts, made: r.g.made, movesUsed: g.movesLeft - r.g.movesLeft }; }
    let ok = got.sum === c.sum && got.chainPoints === c.chainPoints && got.blastPoints === c.blastPoints && JSON.stringify(got.removed) === JSON.stringify(c.removed) && got.movesUsed === 1;
    if (c.reward) ok = ok && got.reward && got.reward.cell === c.reward.cell && got.reward.value === c.reward.value && got.reward.type === c.reward.type;
    if (sum === g.target) ok = ok && got.committedPts === c.chainPoints + c.blastPoints && got.made === 1;
    else ok = ok && got.made === 0 && r.ev.type === "wrong";
    out.push({ id: c.id, ok, got });
  }
  return { ok: out.every((x) => x.ok), cases: out };
}
// MC-006 evidence: beam search for a no-speed three-star route with the real engine (no hints/undo)
function threeStar(li, width = 60) {
  const L = LEVELS.match[li], [, t3] = M.thresholds(L.quota);
  let beam = [{ g: M.start(li), path: [] }], best = null;
  for (let step = 0; step < L.quota; step++) {
    const next = [];
    for (const b of beam) for (const ch of M.allChains(b.g, 4000)) {
      const r = M.release(b.g, ch); if (!r.ev || r.ev.type !== "clear") continue;
      const n = { g: r.g, path: b.path.concat([ch]) };
      if (r.g.status === "won") { if (!best || M.core(r.g) > M.core(best.g)) best = n; } else if (r.g.status === "playing") next.push(n);
    }
    next.sort((a, b) => (b.g.chainPts + b.g.blastPts) - (a.g.chainPts + a.g.blastPts));
    const seen = new Set(); beam = [];
    for (const n of next) { const key = n.g.cells.map((c) => c.v + (c.sp ? c.sp[0] : "")).join(""); if (seen.has(key)) continue; seen.add(key); beam.push(n); if (beam.length >= width) break; }
  }
  return best ? { level: li + 1, core: M.core(best.g), threeStar: t3, stars: M.stars(best.g), reached: M.core(best.g) >= t3, route: best.path } : { level: li + 1, reached: false };
}
window.__qa = {
  state: () => {
    const g = ui.game, base = { screen: qaScreen(), mode: ui.mode, level: ui.mode === "match" && ui.screen === "intro" ? ui.introLi : g ? g.li : null, qaLevel: g ? MODES.indexOf(g.mode) * 12 + g.li : null, modal: ui.modal || null };
    if (!g || ui.screen !== "play" || g.mode !== ui.mode) return base;
    if (g.mode === "match") return { ...base, version: g.version, target: g.target, movesLeft: g.movesLeft, made: g.made, quota: g.quota, score: M.score(g), coreScore: M.core(g),
      chainPts: g.chainPts, blastPts: g.blastPts, finish: g.finish, speedBonus: g.speedBonus, stars: M.stars(g), assisted: g.assisted, hints: g.hints, undoCount: g.undos, undoAvailable: g.hist.length,
      board: g.cells.map((c) => c.v), specials: g.cells.map((c) => c.sp), ids: g.cells.map((c) => c.id), rng: g.rng, chain: ui.chain.slice(), speed: g.speed, timing: g.timing, elapsedMs: g.elapsed, seq: g.seq };
    if (g.mode === "equation") return { ...base, target: E.tray(g).target, round: g.round, attempts: g.attempts, score: g.score, tray: E.tray(g).values.slice(), expression: E.text(g.tokens, E.tray(g).values) };
    return { ...base, target: g.target, remaining: C.remaining(g).length, selected: g.sel.slice(), score: g.score, assists: g.assists, board: g.values.map((v, i) => (g.removed[i] ? null : v)) };
  },
  actions: () => {
    const g = ui.game;
    if (ui.screen !== "play" || ui.modal || !g) return [];
    if (g.mode === "match") {
      if (g.status !== "playing") return [];
      const out = [];
      for (let i = 0; i < g.cells.length; i++) { if ((i + 1) % g.cols) out.push({ chain: [i, i + 1] }); if (i + g.cols < g.cells.length) out.push({ chain: [i, i + g.cols] }); }
      return out.concat(M.allChains(g, 40).map((c) => ({ chain: c })), ["hint"], g.hist.length ? ["undo"] : []);
    }
    if (g.mode === "equation") return g.status === "playing" ? E.legal(g).concat(["hint"]) : [];
    if (g.status === "stuck") return ["undo"];
    if (g.status !== "playing") return [];
    const out = C.remaining(g).map((i) => "t" + i);
    if (C.canClear(g)) out.push("clear");
    if (g.stack.length) out.push("undo");
    return out.concat(["hint"]);
  },
  act: (a) => {
    const g = ui.game; if (!g || ui.screen !== "play") return;
    if (ui.modal) ui.modal = null;
    ui.busyUntil = 0;
    if (g.mode === "match") { if (a === "hint") mHint(); else if (a === "undo") mUndo(); else if (a && a.chain) mCommit(a.chain); }
    else if (g.mode === "equation") eqInput(a);
    else clearAct(a);
  },
  reset: (n) => {
    if (n === undefined || n === null) { if (ui.game) startLevel(ui.game.mode, ui.game.li); else startLevel("match", 0); }
    else startLevel(MODES[Math.floor(n / 12)], n % 12);
    render();
  },
  levels: () => 36,
  solve: () => {
    const g0 = ui.game; if (!g0) return [];
    if (g0.mode === "match") { // simulate seeded refills on a copy
      const seq = []; let g = g0;
      while (g.status === "playing" && seq.length < 50) { const ch = M.shortest(g); if (!ch) break; seq.push({ chain: ch }); g = M.release(g, ch).g; }
      return seq;
    }
    if (g0.mode === "equation") {
      const seq = g0.tokens.length ? ["clear"] : [];
      for (let r = g0.round; r < 3; r++) {
        const s = E.solveTray(LEVELS.equation[g0.li].rounds[r]);
        s.ids.forEach((id, k) => { seq.push("n" + id); if (k < s.ops.length) seq.push(s.ops[k]); });
        seq.push("submit");
      }
      return seq;
    }
    const seq = g0.sel.map((i) => "t" + i); // deselect
    let g = g0;
    while (g.status === "stuck" || !C.cover(g, C.remaining(g))) { if (!g.stack.length) break; seq.push("undo"); g = C.undo(g).g; }
    for (const grp of C.cover(g, C.remaining(g)) || []) { grp.forEach((i) => seq.push("t" + i)); seq.push("clear"); }
    return seq;
  },
  validate: validateData,
  // H-001-v1 extensions (MC-009); not used by normal play
  fixtures: runFixtures,
  threeStar,
  tick: (ms) => accrue(ms),           // deterministic active-time advance (only counts when the clock would run)
  timingActive: () => mTimingActive(),
  setSetting: (k, v) => { progress.settings[k] = v; save(); render(); },
  open: (screen, li) => { ui.mode = "match"; ui.modal = null; if (screen === "intro") { ui.introLi = li || 0; } ui.screen = screen; if (screen === "home") loadArt(); render(); },
  modal: (name) => { ui.modal = name; render(); },
  dragChain: (cells) => { let ch = []; for (const i of cells) ch = M.extend(ui.game, ch, i); return ch; },
  saved: () => JSON.parse(JSON.stringify(progress)),
};
