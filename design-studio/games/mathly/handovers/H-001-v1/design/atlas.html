<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mathly H-001-v1 — screen atlas</title><link rel="stylesheet" href="atlas.css"></head><body>
<header class="review"><h1>Playful Deck · H-001-v1</h1><p>Specification atlas · not a playable game</p><label>State <select id="state"></select></label><label>Canvas <select id="size"><option>375x667</option><option>320x568</option><option>390x844</option></select></label><label>Safe insets <select id="safe"><option value="0">0px test canvas</option><option value="24">24px each edge</option></select></label></header>
<main id="canvas"><div id="phone"><nav><span class="circle">‹</span><b>Mathly</b><span class="circle settings">⚙</span></nav><div class="plaques"><div class="target"><small>TARGET</small><strong id="target"></strong></div><div class="result"><small>RESULT</small><strong id="result"></strong></div></div><section class="workspace"><div class="wellbar"><button id="prev" aria-label="Previous page">‹</button><span id="count"></span><button id="next" aria-label="Next page">›</button></div><div id="cells"></div><div id="notice"></div><div id="edit"></div></section><div id="tray"></div><div class="palette"><span>+</span><span>−</span><span>×</span><span>÷</span><span>(</span><span>)</span></div><footer><span>↶ Undo</span><span>Hint</span><span>↻ Restart</span></footer></div></main><p class="review" id="metrics"></p>
<script src="atlas-data.js"></script><script>
const $=id=>document.getElementById(id);let page=0;
const names=['empty','partial','selected','early','incomplete','invalid','full','long','solved'];for(const id of names){const o=document.createElement('option');o.value=id;o.textContent=id;$('state').appendChild(o);}
$('state').value='partial';
function render(){const f=FIXTURES.find(f=>f.id===$('state').value);const [w,h]=$('size').value.split('x').map(Number),safe=+$('safe').value,u=h-safe*2;const phone=$('phone');phone.style.width=w+'px';phone.style.height=u+'px';phone.classList.toggle('compact',u<620||w<350);$('canvas').style.paddingBlock=safe+'px';$('target').textContent=f.target;let val=f.expectedValue==='31/2'?'15.5':f.expectedValue||'—';if(f.id==='incomplete')val='Incomplete';if(f.id==='invalid')val='No value';if(f.id==='solved')val+=' ✓';$('result').textContent=val;$('result').classList.toggle('words',val.length>7);phone.classList.toggle('solved',f.id==='solved');const used=new Set(f.tokens.filter(t=>t[0]==='n'));$('tray').replaceChildren();for(const c of f.cards){let el=document.createElement('div');el.className=used.has(c.id)?'ghost':'source';el.textContent=used.has(c.id)?'Used':c.value;$('tray').appendChild(el);}
const workspace=phone.querySelector('.workspace');const wh=workspace.clientHeight;const cols=Math.floor((workspace.clientWidth-12+4)/48);const rows=wh>=300&&w>=350?3:wh>=240?2:1;const cap=cols*rows,pages=Math.max(1,Math.ceil(f.tokens.length/cap));page=Math.min(page,pages-1);$('cells').style.gridTemplateColumns=`repeat(${cols},44px)`;$('cells').style.height=(rows*44+(rows-1)*4)+'px';$('cells').replaceChildren();f.tokens.slice(page*cap,(page+1)*cap).forEach((t,i)=>{const el=document.createElement('button');el.className='cell '+(t[0]==='n'?'number':'operator');el.textContent=t[0]==='n'?f.cards.find(c=>c.id===t).value:({'*':'×','/':'÷','-':'−'}[t]||t);if(f.selectedIndex===i+page*cap)el.classList.add('selected');else if(i+page*cap===f.tokens.length-1&&f.id!=='solved')el.classList.add('caret');$('cells').appendChild(el);});if(!f.tokens.length)$('cells').innerHTML='<span class="empty-caret" aria-label="Insertion caret"></span>';
$('count').textContent=pages>1?`Page ${page+1}/${pages} · ${page*cap+1}–${Math.min(f.tokens.length,(page+1)*cap)}`:`YOUR EXPRESSION · ${used.size}/5`;$('prev').disabled=page===0;$('next').disabled=page===pages-1;for(const id of ['prev','next'])$(id).style.visibility=pages===1?'hidden':'visible';const copy={empty:'Place a number to begin',partial:'Tap a token to edit',selected:'Selected: 3',early:'Use all 5 cards to finish',incomplete:'Last valid: 4 · incomplete expression',invalid:'Cannot divide by zero',full:'Target 16 · try another arrangement',long:'Target 16 · try another arrangement',solved:'Solved · all five cards used'};$('notice').textContent=copy[f.id];$('edit').innerHTML=f.id==='selected'?['Before','After','Remove','Done'].map(t=>`<button>${t}</button>`).join(''):'<span>'+(f.id==='solved'?'Continuing to completion…':'Place cards and operators at the caret')+'</span>';$('metrics').textContent=`${w} × ${h} · safe ${safe}px × 2 · workspace ${wh}px · ${cols} columns × ${rows} rows · ${cap} tokens/page`;
}
for(const id of ['state','size','safe'])$(id).onchange=()=>{page=0;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};render();
</script></body></html>
